/* Layout: one centered stage — Evelyn's real paper card unfolds in the middle, her note appears beneath it. */
:root{
  --bg:#f6e3e7;          /* blush, like her pink marker diluted */
  --bg-glow:#fff6ef;
  --ink:#3a2340;         /* plum ink */
  --ink-soft:#7a5d80;
  --pink:#d9567c;        /* her "happy birthday" marker */
  --teal:#2f9e7c;        /* her ribbon green */
  --flame:#ff9a3c;
  --pill:#ffffffcc;
  --shadow:rgba(80,30,60,.28);
  --hand:"Caveat","Bradley Hand","Segoe Print","Comic Sans MS",cursive;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d1630;--bg-glow:#3a2546;--ink:#f6e9ef;--ink-soft:#c3aecb;--pink:#ff8fb0;--teal:#6fd8b4;--flame:#ffb057;--pill:#2a2040e6;--shadow:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1630;--bg-glow:#3a2546;--ink:#f6e9ef;--ink-soft:#c3aecb;--pink:#ff8fb0;--teal:#6fd8b4;--flame:#ffb057;--pill:#2a2040e6;--shadow:rgba(0,0,0,.55);color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);overflow-x:hidden;
  background-image:radial-gradient(60% 45% at 50% 42%,var(--bg-glow),transparent 70%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box}
.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-block:20px;box-sizing:border-box}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0}
.stage{position:relative;width:100%;display:flex;align-items:center;justify-content:center}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.card{position:relative;display:flex;flex-direction:column;cursor:pointer;filter:drop-shadow(0 10px 18px var(--shadow));
  -webkit-tap-highlight-color:transparent;outline:none;border-radius:4px}
.card:focus-visible{outline:3px solid var(--pink);outline-offset:8px}
.panel{background-repeat:no-repeat;position:relative;flex:none}
.hinge{position:relative;flex:none;overflow:visible}
.hinge .panel{position:absolute;left:0;right:0;backface-visibility:hidden}
.shade{position:absolute;inset:0;pointer-events:none}
.crop{position:absolute;background-repeat:no-repeat;pointer-events:none;will-change:transform}
.flame{transform-origin:50% 100%}
.cake{transform-origin:50% 100%}
.patch{position:absolute;background:#f8f8f6;border-radius:45%;filter:blur(1.2px);opacity:0;pointer-events:none}
.glow{position:absolute;width:13%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(circle,rgba(255,236,170,.95) 0 14%,rgba(255,170,70,.55) 34%,rgba(255,150,60,0) 70%);mix-blend-mode:screen}
.hint{position:absolute;left:50%;bottom:-6px;transform:translate(-50%,100%);display:flex;align-items:center;gap:6px;white-space:nowrap;
  background:var(--pill);color:var(--ink);font-family:var(--hand);font-size:1.35rem;padding:4px 14px 6px;border-radius:999px;pointer-events:none}
.hint svg{width:16px;height:16px;fill:none;stroke:var(--pink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.msg{text-align:center;font-family:var(--hand);line-height:1.05;min-height:5.4rem}
.msg h1{margin:0;font-size:clamp(2.1rem,8vw,2.9rem);color:var(--pink);font-weight:700;text-wrap:balance}
.msg p{margin:.15rem 0 0;font-size:clamp(1.5rem,5.5vw,1.9rem);color:var(--teal);font-weight:700}
.again{font-family:var(--serif);font-size:.85rem;color:var(--ink-soft);background:none;border:1px solid currentColor;border-radius:999px;padding:6px 14px;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.again svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;vertical-align:-2px;margin-right:6px}
.again[aria-pressed="true"]{color:var(--pink)}
.again:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
.capture .row,.capture .eyebrow{visibility:hidden}
</style>

let W=320,H=0,hTop=0,hMid=0,hBot=0,D=900;
function layout(){
  const vw=document.documentElement.clientWidth, vh=innerHeight;
  const maxH=Math.min(vh*0.66, 640);
  W=Math.min(vw-40, 360, maxH*NW/NH);
  H=W*NH/NW; hTop=H*Y_TOP; hMid=H*(Y_MID-Y_TOP); hBot=H*(1-Y_BOT); D=W*2.6;
  const set=(el,off,h)=>{el.style.width=W+"px";el.style.height=h+"px";el.style.backgroundImage=`url(${IMG})`;
    el.style.backgroundSize=`${W}px ${H}px`;el.style.backgroundPosition=`0 ${-off}px`;};
  set(pTop,0,hTop+0.5); set(pA,hTop,hMid+0.5); set(pB,H*Y_MID,hMid+0.5); set(pBot,H*Y_BOT,hBot);
  pA.style.top="0"; pA.style.transformOrigin="50% 0"; pB.style.bottom="0"; pB.style.transformOrigin="50% 100%";
  hA.style.width=hB.style.width=W+"px";
  stage.style.height=(H+24)+"px";
  const s=W/1092;
  const place=(el,[x0,y0,x1,y1],img,ox=0,oy=690)=>{el.style.left=(x0-ox)*s+"px";el.style.top=(y0-oy)*s+"px";el.style.width=(x1-x0)*s+"px";el.style.height=(y1-y0)*s+"px";
    if(img){el.style.backgroundImage=`url(${IMG})`;el.style.backgroundSize=`${W}px ${H}px`;el.style.backgroundPosition=`${-x0*s}px ${-y0*s}px`;}};
  place(cakeTop,CAKE_TOP,true); place(cakeBot,CAKE_BOT,true,0,1031);
  const [cx,cy]=CAKE_TOP;
  FLAME_BOX.forEach((b,i)=>{place(flames[i],b,true,cx,cy);place(patches[i],[b[0]-2,b[1]-2,b[2]+2,b[3]-1],false,cx,cy);});
  FLAMES.forEach(([x,y],i)=>{glows[i].style.left=(x*1092-cx)*s+"px";glows[i].style.top=(690+y*341-cy)*s+"px";});
  const r=devicePixelRatio||1; cv.width=stage.clientWidth*r; cv.height=stage.clientHeight*r; ctx.setTransform(r,0,0,r,0,0);
}

// ---- timeline ----
let manual=null; const clock=()=>manual??performance.now()/1000;
let from=0,to=0,t0=-10,dur=1.5,bursts=[],seed=7,touched=false;
const SONG_END=12.0, SONG_OFF=3.2; // the track opens with Evelyn's voice; the song starts 3.2 s in
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function openness(t){const k=Math.min(1,Math.max(0,(t-t0)/dur));return from+(to-from)*ease(k);}
let fromGesture=false;
function toggle(force){
  const t=clock(),p=openness(t); touched=true;
  const target=force??(to>0.5?0:1); if(target===to)return;
  from=p;to=target;t0=t;dur=reduce?0.01:1.5*Math.abs(target-p)+0.1;
  if(target===1&&!reduce){seed=(seed*9301+49297)%233280;bursts=[{at:t0+dur*0.62,seed}];}
  if(target===1)blownAt=null;
  if(!capture){ if(target===1&&fromGesture) playSong(); if(target===0) stopSong(); }
  card.setAttribute("aria-label",target?"Birthday card, open. Tap to fold it back up.":"Birthday card. Tap to open.");
}
const gesture=f=>(...a)=>{fromGesture=true;f(...a);fromGesture=false;};
card.addEventListener("click",gesture(()=>toggle()));
card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();gesture(toggle)();}});
again.addEventListener("click",gesture(()=>toggle()));
// ---- song ----
let finaleDone=false;
function setMusicUI(on){music.setAttribute("aria-pressed",on);music.querySelector("span").textContent=on?"Stop the song":"Play the song";}
function playSong(){try{song.currentTime=0;finaleDone=false;const p=song.play();if(p)p.catch(()=>setMusicUI(false));setMusicUI(true);}catch(e){}}
function stopSong(){try{song.pause();}catch(e){}setMusicUI(false);}
song.addEventListener("ended",()=>setMusicUI(false));
music.addEventListener("click",()=>{ if(!song.paused){stopSong();return;} if(to===0){fromGesture=true;toggle(1);fromGesture=false;}else playSong(); });

// ---- confetti: Evelyn-style marker dashes ----
function rng(s){return()=>(s=(s*16807)%2147483647)/2147483647;}
function drawConfetti(t){
  ctx.clearRect(0,0,stage.clientWidth,stage.clientHeight);
  if(to===0)return;
  for(const b of bursts) drawBurst(t,b);
}
function drawBurst(t,b){
  const age=t-b.at; if(age<0||age>5)return;
  const rand=rng(b.seed+1), u=W/320;
  const cr=card.getBoundingClientRect(), sr=stage.getBoundingClientRect();
  const ox=cr.left-sr.left+W*0.5, oy=cr.top-sr.top+hTop+hMid*0.55;
  for(let i=0;i<110;i++){
    const a=-Math.PI/2+(rand()-.5)*2.5, sp=(260+rand()*420)*u, delay=rand()*0.18;
    const len=(7+rand()*9)*u, rot0=rand()*6.28, spin=(rand()-.5)*10, col=COLORS[(rand()*COLORS.length)|0];
    const tt=age-delay; if(tt<0)continue;
    const drag=1.6, k=(1-Math.exp(-drag*tt))/drag;
    const x=ox+Math.cos(a)*sp*k+(rand()-.5)*20*u*Math.sin(tt*3+i);
    const y=oy+Math.sin(a)*sp*k+ 260*u*tt*tt*0.5;
    const alpha=Math.max(0,Math.min(1,(4.6-tt)/1.2));
    const r=rot0+spin*tt;
    ctx.globalAlpha=alpha*0.9; ctx.strokeStyle=col; ctx.lineWidth=3.2*u; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(x-Math.cos(r)*len/2,y-Math.sin(r)*len/2); ctx.lineTo(x+Math.cos(r)*len/2,y+Math.sin(r)*len/2); ctx.stroke();
  }
  ctx.globalAlpha=1;
}

// ---- frame ----
function render(t){
  const p=openness(t), th=(1-p)*Math.PI/2;           // fold angle: 90° closed, 0° flat
  const proj=hMid*Math.cos(th)*D/(D+hMid*Math.sin(th)); // projected height of each hidden panel
  hA.style.height=proj+"px"; hB.style.height=proj+"px";
  pA.style.transform=`perspective(${D}px) rotateX(${-th}rad)`;
  pB.style.transform=`perspective(${D}px) rotateX(${th}rad)`;
  const s=Math.sin(th);
  sA.style.background=`linear-gradient(to bottom,rgba(60,30,50,${0.05*s}),rgba(60,30,50,${0.38*s}))`;
  sB.style.background=`linear-gradient(to top,rgba(255,255,255,0),rgba(60,30,50,${0.22*s}))`;
  pA.style.visibility=pB.style.visibility=p<0.01?"hidden":"visible";
  hint.style.opacity=Math.max(0,1-p*4)*(0.75+0.25*Math.sin(t*4));
  hint.style.transform=`translate(-50%,calc(100% + ${Math.max(0,Math.sin(t*4))*4}px))`;
  const m=Math.min(1,Math.max(0,(p-0.7)/0.3));
  msg.style.opacity=m; msg.style.transform=`translateY(${(1-m)*10}px)`;
  again.textContent=to>0.5?"Fold it back up":"Open the card"; again.style.opacity=capture?0:1;
  glows.forEach((g,i)=>{const f=1+0.12*Math.sin(t*13+i*2.1)+0.07*Math.sin(t*7.3+i);
    g.style.opacity=Math.max(0,(p-0.75)/0.25)*(0.75+0.25*Math.sin(t*9+i));g.style.transform=`translate(-50%,-50%) scale(${f})`;});
  if(!capture&&!reduce&&!song.paused&&!finaleDone&&song.currentTime-SONG_OFF>=SONG_END){finaleDone=true;blownAt=t;bursts.push({at:t,seed:seed+77});}
  // song clock: seconds into the song, or null when it isn't playing
  const songT=capture?(t>=window.__songStart?t-window.__songStart:null):(song.paused?null:song.currentTime-SONG_OFF);
  // cake hops on every beat (a little higher on the first beat of each bar), anchored on the plate
  let k=1;
  if(songT!=null&&songT>=LEAD&&songT<SONG_END&&!reduce){
    const n=Math.floor((songT-LEAD)/BEAT), ph=(songT-LEAD)-n*BEAT, x=ph/(BEAT*0.6);
    const amp=(n-1)%3===0?0.055:0.03; if(x<1)k=1+amp*Math.sin(Math.PI*x);
  }
  const lift=(CAKE_BOT[3]-1031)*(W/1092)*(k-1);
  cakeBot.style.transform=`scaleY(${k})`;
  cakeTop.style.transform=`translateY(${-lift}px) scaleY(${k})`;
  // candles: flicker, then blow out at the end of the song
  const out=blownAt!=null&&t>=blownAt, kb=out?Math.min(1,(t-blownAt)/0.3):0;
  flames.forEach((f,i)=>{
    const a=reduce?0:1;
    const sx=1.03+a*0.05*Math.sin(t*11+i*1.7), sy=1.06+a*(0.09*Math.sin(t*13.7+i*2.3)+0.04*Math.sin(t*23+i)), sk=a*5*Math.sin(t*8.3+i*1.1);
    f.style.transform=out?`scale(${sx*(1-kb)},${sy*(1-kb)})`:`scale(${sx},${sy}) skewX(${sk}deg)`;
    patches[i].style.opacity=out?1:0;
  });
  if(out)glows.forEach(g=>g.style.opacity=0);
  drawConfetti(t);
  drawSmoke(t);
}
function drawSmoke(t){
  if(blownAt==null||to===0)return; const age=t-blownAt; if(age<0||age>3.4)return;
  const u=W/320, cr=card.getBoundingClientRect(), sr=stage.getBoundingClientRect(), s=W/1092;
  FLAME_BOX.forEach((b,i)=>{
    const fx=cr.left-sr.left+(b[0]+b[2])/2*s, fy=cr.top-sr.top+b[1]*s+4*u;
    for(let j=0;j<14;j++){
      const tt=age-j*0.07; if(tt<0||tt>2.6)continue;
      const y=fy-tt*26*u-tt*tt*4*u, x=fx+Math.sin(tt*2.6+i*1.3+j*0.45)*(2+tt*7)*u;
      const r=(3+tt*7)*u, al=0.22*(1-tt/2.6)*Math.min(1,tt*6);
      const g=ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,`rgba(140,132,145,${al})`); g.addColorStop(1,"rgba(140,132,145,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill();
    }
  });
}
layout(); addEventListener("resize",()=>{layout();render(clock());});

if(capture){
  window.__trackStart=1.6; window.__songStart=window.__trackStart+SONG_OFF;
  window.__render=(t)=>{manual=t; if(t>=1.4&&to===0&&!touched){t0=1.4;from=0;to=1;dur=1.5;bursts=[{at:t0+dur*0.62,seed},{at:window.__songStart+SONG_END,seed:seed+77}];blownAt=window.__songStart+SONG_END;touched=true;} render(t);};
  window.__render(0);
}else{
  const loop=()=>{const t=clock(); render(t); requestAnimationFrame(loop);};
  loop();
}
})();
</script>

</body></html>
